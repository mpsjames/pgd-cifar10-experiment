[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgd-cifar10-experiment"
version = "0.1.0"
description = "PGD adversarial attack and defense study on CIFAR-10"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "timm>=1.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-image>=0.23",
  "matplotlib>=3.8",
  "mlflow>=2.13",
  "omegaconf>=2.3",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]
notebooks = [
  "ipykernel>=6.29",
  "nbformat>=5.10",
  "nbconvert>=7.16",
]
robustbench = [
  "robustbench @ git+https://github.com/RobustBench/robustbench.git",
]
parity = [
  "torchattacks>=3.5",
]
all = [
    "pgd-cifar10-experiment[dev,notebooks,robustbench,parity]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:The filesystem tracking backend.*:FutureWarning",
]
markers = [
  "gpu: tests that require CUDA",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["N812"]
