arch: vit_tiny
# Recipe targeted at ViT-Tiny from scratch on CIFAR-10. Optimizer/scheduler/
# regularization overrides replace the CNN-style defaults from
# `configs/training/{clean,apgd_at}.yaml` without changing per-iteration cost
# (label smoothing, mixup/cutmix and stochastic depth are essentially free).
training:
  batch_size: 256
  use_amp: true
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.05
  betas: [0.9, 0.999]
  warmup_epochs: 5
  min_lr: 1.0e-6
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 1.0
  mixup_switch_prob: 0.5
  grad_clip: 1.0
model:
  image_size: 32
  patch_size: 4
  embed_dim: 192
  depth: 12
  num_heads: 3
  mlp_ratio: 4.0
  dropout: 0.1
  attn_dropout: 0.0
  drop_path: 0.1
